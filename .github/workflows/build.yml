name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The signing key comes from repository secrets (Settings > Secrets and variables > Actions):
      # KEYSTORE_BASE64 = the keystore file, base64-encoded; SIGNING_PASSWORD = its password.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: building with the debug key and skipping the release."
          fi

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FocusBoardSync.apk

      - name: Publish release (open this page on your phone to install)
        if: env.SIGNING_KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FocusBoard Sync (build ${{ github.run_number }})
          body: Tap FocusBoardSync.apk below to download and install it on your phone.
          files: FocusBoardSync.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: FocusBoardSync
          path: FocusBoardSync.apk
